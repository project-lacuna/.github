name: Security report guidance
description: Security issues must be reported privately
labels: [security]
body:
  - type: markdown
    attributes:
      value: |
        Do not submit sensitive vulnerabilities, active credentials, exploit
        details, or personal/customer data through a public issue.

        Please use the private reporting route in SECURITY.md instead.
  - type: input
    id: redirect
    attributes:
      label: Confirmation
      description: Type "I will report privately" after reading SECURITY.md.
    validations:
      required: true
