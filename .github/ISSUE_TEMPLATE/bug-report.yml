name: Bug report
description: Report a reproducible defect without including sensitive information
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, personal data, customer data, production logs,
        or security-sensitive details. Use the private security route for a
        vulnerability or exposed secret.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, sanitized reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed or replaced sensitive information with safe placeholders.
          required: true
